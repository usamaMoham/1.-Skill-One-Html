<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Cards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="playing-cards">
        <div class="card card1">
            <div class="topA">
                <div class="top">A</div>
                <div class="left">♠</div>
            </div>
            <div class="middle">♠</div>
            <div class="bottomA">
                <div class="right">♠</div>
                <div class="bottom">A</div>
            </div>
        </div>
        <div class="card card1">
            <div class="topA">
                <div class="top">2</div>
                <div class="left">♣</div>
            </div>
            <div class="middle2">
                <div class="middle">♣</div>
                <div class="middle">♣</div>
            </div>
            <div class="bottomA">
                <div class="right">♣</div>
                <div class="bottom">2</div>
            </div>
        </div>
        <div class="card card1">
            <div class="topA">
                <div class="top red">3</div>
                <div class="left red">♥</div>
            </div>
            <div class="middle3 red">
                <div class="middle">♥</div>
                <div class="middle">♥</div>
                <div class="middle">♥</div>
            </div>
            <div class="bottomA red">
                <div class="right">♥</div>
                <div class="bottom">3</div>
            </div>
        </div>
    </main>
</body>
</html>
