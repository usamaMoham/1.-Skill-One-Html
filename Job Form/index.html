<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css"/>
</head>

<body>
<div class="container">
    <h1>Job Form Application</h1>
    <form>

        <fieldset>

            <!-- Full Name -->
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <!-- Email -->
            <label for="email">Your Email Address:</label>
            <input type="email" id="email" name="email" required>
            
            <!-- Position -->
            <label for="position">Select Position:</label>
            <select id="position" name="position" required>
                <option value="">Select Your Position</option>
                <option value="developer">Developer</option>
                <option value="data-engineer">Data Engineer</option>
                <option value="ml-ai">ML/AI Engineer</option>
            </select>

        </fieldset>

        <!-- Availability -->
        <fieldset class="radio-group">
            <legend>Availability</legend>

            <label for="full-time" class="ava-time" >Full-Time: </label>
            <input type="radio" id="full-time" name="availability" value="full-time" class="avai-time"/>

            <label for="part-time" class="ava-time" >Part-Time: </label>
            <input type="radio" id="part-time" name="availability" value="part-time" class="avai-time"/>
        </fieldset>

        <!-- Message -->
         <fieldset>
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" cols="50" required></textarea>
         </fieldset>

        <!-- Submit -->
        <button type="submit">Submit</button>

    </form>
</div>
</body>
</html>
